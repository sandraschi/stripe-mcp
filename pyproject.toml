[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stripe-mcp"
version = "0.1.0"
description = "FastMCP server for Stripe payment gateway, billing ops, customer support, and Austrian/EU tax compliance"
readme = "README.md"
authors = [
    { name = "sandraschi" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4,<4.0.0",
    "stripe>=8.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
