name: stripe-mcp CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Pytest
        run: uv run pytest

      - name: Set up Node.js & Bun
        uses: oven-sh/setup-bun@v1

      - name: Build Webapp & Check Types
        run: |
          cd webapp
          bun install
          npx tsc --noEmit
          bun run build
